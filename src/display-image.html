<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img id="image" src="" alt="Display image">

  <script>
    const params = new URLSearchParams(window.location.search);
    const imageUrl = params.get('url');

    if (imageUrl) {
      document.getElementById('image').src = imageUrl;
    } else {
      document.body.innerHTML = '<p style="color: white; text-align: center;">No image URL provided.<br>Usage: display-image.html?url=https://example.com/image.png</p>';
    }
  </script>
</body>
</html>
