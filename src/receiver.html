<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signage Receiver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    #blank-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #blank-screen.hidden { display: none; }

    #frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }

    /* Small status dot in the corner — visible only to crew, not audience */
    #status-dot {
      position: fixed;
      bottom: 12px;
      right: 12px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #c00;
      opacity: 0.6;
      z-index: 100;
      transition: background 0.4s;
    }
    #status-dot.connected { background: #0c0; }

    /* Slideshow layer — double-buffered, sits above iframe, below overlays */
    #slideshow-layer {
      position: fixed;
      inset: 0;
      z-index: 8;
      background: #000;
      display: none;
    }
    #slideshow-layer.active { display: block; }
    #slideshow-layer img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.8s ease;
    }
    #ss-img-a { opacity: 1; }
    #ss-img-b { opacity: 0; }

    /* Fallback image — shown when no content or connection lost */
    #fallback-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
      display: none;
    }
    #fallback-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #fallback-screen.visible { display: block; }

    /* Setup warning shown when Firebase is not yet configured */
    #setup-warning {
      position: fixed;
      inset: 0;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 200;
      font-size: 1.1rem;
      text-align: center;
      padding: 32px;
    }
    #setup-warning h1 { font-size: 2rem; color: #f0a500; }
    #setup-warning code {
      background: #222;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    #setup-warning.hidden { display: none; }

    /* Video layer */
    #video-player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 9;
      display: none;
    }
    #video-player.active { display: block; }

    /* Logo overlay */
    #logo-overlay {
      position: fixed;
      z-index: 15;
      pointer-events: none;
      display: none;
    }
    #logo-overlay.pos-top-left     { top: 20px; left: 20px; }
    #logo-overlay.pos-top-right    { top: 20px; right: 20px; }
    #logo-overlay.pos-bottom-left  { bottom: 20px; left: 20px; }
    #logo-overlay.pos-bottom-right { bottom: 20px; right: 20px; }
    #logo-overlay.size-small  { height: 40px; }
    #logo-overlay.size-medium { height: 70px; }
    #logo-overlay.size-large  { height: 110px; }
  </style>
</head>
<body>

  <!-- Slideshow layer — double-buffered crossfade, no iframe reload -->
  <div id="slideshow-layer">
    <img id="ss-img-a" src="" alt="">
    <img id="ss-img-b" src="" alt="">
  </div>

  <!-- Fallback image — shown when no content is set or connection is lost -->
  <div id="fallback-screen"><img id="fallback-img" src="" alt=""></div>

  <!-- Shown when the controller sets mode to "blank" -->
  <div id="blank-screen"></div>

  <!-- Logo overlay — controlled via Firebase settings -->
  <img id="logo-overlay" src="" alt="">

  <!-- Video player layer -->
  <video id="video-player" autoplay loop muted playsinline></video>

  <!-- Main content frame -->
  <iframe
    id="frame"
    allowfullscreen
    allow="autoplay; fullscreen; picture-in-picture"
    src="about:blank"
  ></iframe>

  <!-- Firebase connection indicator (tiny, bottom-right) -->
  <div id="status-dot" title="Firebase connection"></div>

  <!-- Shown if Firebase config is still the placeholder -->
  <div id="setup-warning">
    <h1>⚙ Setup needed</h1>
    <p>Open <code>receiver.html</code> in a text editor and replace the<br>
       <code>firebaseConfig</code> placeholder with your Firebase project details.</p>
    <p>See <code>controller.html</code> for full setup instructions.</p>
  </div>

  <!-- Firebase SDK (hosted by Google, no bandwidth cost) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // STEP 1 — Replace this block with your Firebase project config.
    //          Get it from: Firebase Console → Project Settings → Your apps → SDK setup
    // ─────────────────────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyCFD9jf5dzh_-mlFiHXvgSl5QZle_QEKt8",
    authDomain: "techorama-stream.firebaseapp.com",
    databaseURL: "https://techorama-stream-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "techorama-stream",
    storageBucket: "techorama-stream.firebasestorage.app",
    messagingSenderId: "482767979960",
    appId: "1:482767979960:web:ed592092560f57a0853b4d",
    measurementId: "G-ZNMTEEV8X9"
  };
    // ─────────────────────────────────────────────────────────────────────────

    const isConfigured = !firebaseConfig.apiKey.startsWith("PASTE");
    const warningEl    = document.getElementById('setup-warning');
    const blankEl      = document.getElementById('blank-screen');
    const frameEl      = document.getElementById('frame');
    const dotEl        = document.getElementById('status-dot');
    const fallbackEl   = document.getElementById('fallback-screen');
    const fallbackImg  = document.getElementById('fallback-img');

    let fallbackUrl = null;
    let hasReceivedContent = false;
    let disconnectTimer = null;

    function showFallback() {
      if (!fallbackUrl) return;
      fallbackEl.classList.add('visible');
    }

    function hideFallback() {
      fallbackEl.classList.remove('visible');
    }

    if (!isConfigured) {
      // Leave the setup warning visible, do nothing else.
    } else {
      warningEl.classList.add('hidden');

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      // Connection indicator + fallback on disconnect
      db.ref('.info/connected').on('value', snap => {
        const connected = !!snap.val();
        dotEl.classList.toggle('connected', connected);
        if (connected) {
          clearTimeout(disconnectTimer);
          disconnectTimer = null;
          // Only hide fallback if we've received real content since page load
          if (hasReceivedContent) hideFallback();
        } else {
          // Show fallback after 15 seconds of being disconnected
          disconnectTimer = setTimeout(showFallback, 15000);
        }
      });

      let slideshowTimer = null;
      const ssLayer = document.getElementById('slideshow-layer');
      const ssImgA  = document.getElementById('ss-img-a');
      const ssImgB  = document.getElementById('ss-img-b');
      let ssSlot = 'a';  // which img is currently visible

      function clearSlideshow() {
        if (slideshowTimer) { clearInterval(slideshowTimer); slideshowTimer = null; }
        ssLayer.classList.remove('active');
        ssImgA.src = '';
        ssImgB.src = '';
        ssSlot = 'a';
      }

      const videoEl = document.getElementById('video-player');
      function clearVideo() {
        videoEl.classList.remove('active');
        videoEl.pause();
        videoEl.src = '';
      }

      function preloadImage(url) {
        return new Promise(resolve => {
          const img = new Image();
          img.onload = img.onerror = () => resolve();
          img.src = url;
        });
      }

      function showSlide(url) {
        if (ssSlot === 'a') {
          // B will become visible, preload it then crossfade
          ssImgB.src = url;
          preloadImage(url).then(() => {
            ssImgA.style.opacity = '0';
            ssImgB.style.opacity = '1';
            ssSlot = 'b';
          });
        } else {
          ssImgA.src = url;
          preloadImage(url).then(() => {
            ssImgB.style.opacity = '0';
            ssImgA.style.opacity = '1';
            ssSlot = 'a';
          });
        }
      }

      function imageHtml(url) {
        return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:100vw;height:100vh;overflow:hidden;background:#000}img{width:100%;height:100%;object-fit:cover}</style></head><body><img src="${url}"></body></html>`;
      }

      // Listen for display changes
      db.ref('signage/current').on('value', snap => {
        const data = snap.val();
        if (!data) {
          showFallback();
          return;
        }

        hasReceivedContent = true;
        hideFallback();

        const { url, mode } = data;
        clearSlideshow();
        clearVideo();

        if (mode === 'html') {
          blankEl.classList.add('hidden');
          if (frameEl.srcdoc !== data.html) frameEl.srcdoc = data.html;

        } else if (mode === 'slideshow') {
          blankEl.classList.add('hidden');
          const images = data.images || [];
          if (images.length === 0) return;

          // Preload all images before starting
          Promise.all(images.map(preloadImage)).then(() => {
            ssLayer.classList.add('active');
            frameEl.src = 'about:blank';

            let idx = 0;
            // Show first image immediately (no crossfade needed for very first)
            ssImgA.src = images[0];
            ssImgA.style.opacity = '1';
            ssImgB.style.opacity = '0';
            ssSlot = 'a';
            idx = 1;

            if (images.length > 1) {
              slideshowTimer = setInterval(() => {
                showSlide(images[idx % images.length]);
                idx++;
              }, data.interval || 30000);
            }
          });

        } else if (mode === 'video') {
          blankEl.classList.add('hidden');
          frameEl.src = 'about:blank';
          if (videoEl.src !== url) videoEl.src = url;
          videoEl.classList.add('active');
          videoEl.play();

        } else if (mode === 'blank' || !url) {
          blankEl.classList.remove('hidden');
          frameEl.src = 'about:blank';

        } else if (mode === 'redirect') {
          window.location.href = url;

        } else {
          blankEl.classList.add('hidden');
          if (frameEl.src !== url) frameEl.src = url;
        }
      });

      // Fallback image listener
      db.ref('signage/settings/fallbackImage').on('value', snap => {
        const url = snap.val();
        if (url) {
          fallbackUrl = url;
          fallbackImg.src = url;
        } else {
          fallbackUrl = null;
          fallbackImg.src = '';
          hideFallback();
        }
      });

      // Logo overlay listener
      const logoEl = document.getElementById('logo-overlay');
      db.ref('signage/settings/logo').on('value', snap => {
        const logo = snap.val();
        if (!logo || !logo.url || !logo.visible) {
          logoEl.style.display = 'none';
          return;
        }
        if (logoEl.src !== logo.url) logoEl.src = logo.url;
        logoEl.className = 'pos-' + (logo.position || 'bottom-right') + ' size-' + (logo.size || 'medium');
        logoEl.style.display = 'block';
      });
    }
  </script>
</body>
</html>
